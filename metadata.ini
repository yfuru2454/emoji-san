; For the QGIS Resource Sharing plugin, as another way to get the SVG files:
; Plugins > Resource Sharing > Settings > Add repository, with the URL of
; this repository. install.py does not use this file.
;
; The plugin names the folder of a collection after its "name", and that
; folder name ends up in the projects of its users. Do not rename a
; collection once the repository is public.
[general]
collections=noto_emoji_map,noto_emoji_people

[noto_emoji_map]
name=EmOji-san - Noto Emoji map set
author=yfuru2454
email=yfuru2454@users.noreply.github.com
description=Google Noto Emoji as SVG markers: animals, food, places, transport, activities, objects and symbols. English file names, one folder per category. Artwork by Google, Apache License 2.0.
qgis_minimum_version=3.0
tags=emoji,svg,marker,noto,symbols
license=Apache License 2.0
license_url=https://www.apache.org/licenses/LICENSE-2.0

[noto_emoji_people]
name=EmOji-san - Noto Emoji smileys, people and generic flags
author=yfuru2454
email=yfuru2454@users.noreply.github.com
description=Goes with "EmOji-san - Noto Emoji map set": faces, people (no skin-tone variants) and the 8 flags that are not a country's. Artwork by Google, Apache License 2.0.
qgis_minimum_version=3.0
tags=emoji,svg,marker,noto,smileys
license=Apache License 2.0
license_url=https://www.apache.org/licenses/LICENSE-2.0
